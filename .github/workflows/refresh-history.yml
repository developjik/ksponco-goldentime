name: Refresh realtime history

# 키 불필요한 공개 실시간 API(ksponco parkingorsApi)를 30분마다 호출해
# public/data/realtime-history.json에 쌓는다(홈 '최근 24시간 추이' 패널의 데이터). GITHUB_TOKEN push는 push 이벤트를
# 트리거하지 않으므로(재귀 방지) deploy.yml이 workflow_run으로 이어받는다.
on:
  schedule:
    - cron: '7,37 * * * *' # 매시 7분·37분(정각 경쟁 회피)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect-history.mjs
        env:
          PARKING_API_URL: ${{ vars.PARKING_API_URL }}
      - name: Commit updated history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/realtime-history.json
          git diff --cached --quiet || git commit -m 'chore: 실시간 주차현황 스냅샷 갱신'
          git push
