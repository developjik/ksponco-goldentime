name: Aggregate 2025 gates

# 공공데이터포털 API_CPM_008(입출차 전체구역, 약 241만 건)를 전수 수집해
# 게이트×요일×시간 입차 건수·평균 체류시간으로 집산, public/data/gates-2025.json 커밋.
# KSPONCO_ENTRY_API_KEY 시크릿 필요(평문 금지).
#
# 5시간 잡 제한 대응: 스크립트가 time_budget_minutes에 멈추고 체크포인트
# (data/gates-2025.checkpoint.json — 집산 합·완료 페이지만, 원문 없음)를 커밋한다.
# auto_continue면 같은 워크플로를 다시 디스패치해 이어받고, 전 페이지 완료 시 gates-2025.json을 커밋한다.
# dry_run_pages>0이면 그 페이지 수만 조회해 누적 건수만 로그로 남긴다(커밋 없음).
on:
  workflow_dispatch:
    inputs:
      dry_run_pages:
        description: '드라이런 페이지 수(0=전수 수집). 드라이런은 커밋하지 않음'
        type: string
        default: '0'
      concurrency:
        description: '동시 요청 수(요청 시작 간격 2.5초는 유지)'
        type: string
        default: '4'
      time_budget_minutes:
        description: '이 시간이 지나면 새 요청을 멈추고 체크포인트 저장(잡 제한 300분)'
        type: string
        default: '260'
      reset:
        description: '체크포인트를 무시하고 처음부터 수집'
        type: boolean
        default: false
      auto_continue:
        description: '미완료 시 다음 실행을 자동 디스패치'
        type: boolean
        default: true
      chain_left:
        description: '자동 이어받기 남은 횟수(무한 반복 방지)'
        type: string
        default: '5'

permissions:
  contents: read

concurrency:
  group: aggregate-008
  cancel-in-progress: false

jobs:
  aggregate:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
      - id: agg
        run: node scripts/aggregate-008.mjs
        env:
          KSPONCO_ENTRY_API_KEY: ${{ secrets.KSPONCO_ENTRY_API_KEY }}
          DRY_RUN_PAGES: ${{ inputs.dry_run_pages }}
          CONCURRENCY: ${{ inputs.concurrency }}
          TIME_BUDGET_MIN: ${{ inputs.time_budget_minutes }}
          RESET: ${{ inputs.reset }}
      - name: Commit gates data
        # 실패·취소여도 체크포인트는 남긴다(드라이런 제외). refresh-history가 30분마다 main에
        # 커밋하므로 push 전에 rebase한다.
        if: ${{ always() && inputs.dry_run_pages == '0' }}
        env:
          COMPLETE: ${{ steps.agg.outputs.complete }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for f in data/gates-2025.checkpoint.json public/data/gates-2025.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          if [ "$COMPLETE" = 'true' ]; then
            git commit -m 'feat: 2025년 게이트별 입출차 집산 갱신'
          else
            git commit -m 'chore: 게이트 집산 체크포인트 저장'
          fi
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Continue in next run
        if: ${{ success() && inputs.dry_run_pages == '0' && inputs.auto_continue && steps.agg.outputs.complete == 'false' && fromJSON(inputs.chain_left) > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONCURRENCY: ${{ inputs.concurrency }}
          TIME_BUDGET_MIN: ${{ inputs.time_budget_minutes }}
          CHAIN_LEFT: ${{ inputs.chain_left }}
        run: |
          gh workflow run aggregate-008.yml --ref main \
            -f concurrency="$CONCURRENCY" \
            -f time_budget_minutes="$TIME_BUDGET_MIN" \
            -f auto_continue=true \
            -f chain_left="$((CHAIN_LEFT - 1))"
