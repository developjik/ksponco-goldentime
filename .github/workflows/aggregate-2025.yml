name: Aggregate 2025 pattern

# 공공데이터포털 API_CPM_009(시간별 연계: 주차대수·방문객·공연·날씨, 2025년 7,803건)를
# 전수 수집해 요일×시간 평균 주차대수로 집산, public/data/pattern-2025.json으로 커밋한다.
# KSPONCO_LINK_API_KEY 시크릿이 등록되어 있어야 한다(평문 금지).
# 게이트웨이가 간헐적으로 빈 items를 반환하므로 페이지마다 재시도한다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate-2025
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/aggregate-2025.mjs
        env:
          KSPONCO_LINK_API_KEY: ${{ secrets.KSPONCO_LINK_API_KEY }}
      - name: Commit pattern data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/pattern-2025.json
          git diff --cached --quiet || git commit -m 'feat: 2025년 요일×시간 주차 패턴 집산 갱신'
          git push
